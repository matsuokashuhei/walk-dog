# Reusable apps/api static gates: lint, jscpd, knip, typecheck (parallel).
# Local convenience script `npm run check` remains sequential; CI runs gates separately.
name: api-check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [lint, jscpd, knip, typecheck]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.gate }}
        run: npm run ${{ matrix.gate }}
