# Calls reusable api-check and api-rs-check on pull requests that touch API packages or workflows.
name: pull-request

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/api-rs/**"
      - ".github/workflows/pull-request.yml"
      - ".github/workflows/api-check.yml"
      - ".github/workflows/api-rs-check.yml"
      - ".github/workflows/publish.yml"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/api-check.yml

  api-rs-check:
    uses: ./.github/workflows/api-rs-check.yml
