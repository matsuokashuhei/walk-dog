# Calls reusable api-check (Rust) and api-ts-check (Node) on pull requests
# that touch API packages or workflows.
name: pull-request

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/api-ts/**"
      - ".github/workflows/pull-request.yml"
      - ".github/workflows/api-check.yml"
      - ".github/workflows/api-ts-check.yml"
      - ".github/workflows/publish.yml"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/api-check.yml

  api-ts-check:
    uses: ./.github/workflows/api-ts-check.yml
