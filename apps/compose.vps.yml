services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infra/sakura/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: .env.vps
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Drizzle migrate stays on the Node runtime image (publish tag :migrate).
  # RELEASE_IMAGE is the Rust api/worker image; do not point migrate at it.
  migrate:
    image: ${MIGRATE_IMAGE}
    command: ["npm", "run", "migrate"]
    env_file: .env.vps
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${RELEASE_IMAGE}
    env_file: .env.vps
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${RELEASE_IMAGE}
    command: ["worker"]
    env_file: .env.vps
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
