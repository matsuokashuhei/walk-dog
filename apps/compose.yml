services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./api
    command: npm run migrate
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./api
    command: npm run dev
    env_file: .env.local
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
