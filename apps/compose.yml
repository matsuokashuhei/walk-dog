services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticmq:
    image: softwaremill/elasticmq-native
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf

  dynamodb:
    image: amazon/dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  worker:
    build: ./api
    command: npm run worker
    env_file: .env.local
    depends_on:
      - elasticmq
      - dynamodb
    expose:
      - "3001"

  api:
    build: ./api
    command: npm run dev
    env_file: .env.local
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started
      dynamodb:
        condition: service_started

volumes:
  postgres-data:
