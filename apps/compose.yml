# Local stack: api + worker run Rust (apps/api).
# Drizzle migrations use the TypeScript package (apps/api-ts), e.g.:
#   docker compose --profile migrate run --rm migrate
# or from the host: (cd apps/api-ts && npm run migrate) against compose postgres.
services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticmq:
    image: softwaremill/elasticmq-native
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf

  dynamodb:
    image: amazon/dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  # Optional local migrate using the Node/Drizzle runtime image (apps/api-ts).
  migrate:
    build:
      context: ./api-ts
      target: runtime
    command: ["npm", "run", "migrate"]
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["migrate"]
    restart: "no"

  worker:
    build:
      context: ./api
      target: development
    command: ["worker"]
    env_file: .env.local
    depends_on:
      - elasticmq
      - dynamodb
    expose:
      - "3001"

  api:
    build:
      context: ./api
      target: development
    command: ["api"]
    env_file: .env.local
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started
      dynamodb:
        condition: service_started
      worker:
        condition: service_started

volumes:
  postgres-data:
