appId: com.cacheandbuffer.walkdog
---
- launchApp
- assertVisible:
    id: "sign-up-root"
- tapOn:
    id: "sign-up-email"
- inputText: ${MAILOSAUR_EMAIL}
- tapOn:
    id: "sign-up-submit"
- assertVisible:
    id: "verify-root"
- runScript: ../scripts/fetch-mailosaur-otp.js
- tapOn:
    id: "verify-code"
- inputText: ${OTP}
- tapOn:
    id: "verify-submit"
- assertVisible:
    id: "home-root"
